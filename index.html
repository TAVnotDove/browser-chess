<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
    <title>Browser Chess</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <div>
            <div class="flex">
                <div id="ranks">
                    <p>8</p>
                    <p>7</p>
                    <p>6</p>
                    <p>5</p>
                    <p>4</p>
                    <p>3</p>
                    <p>2</p>
                    <p>1</p>
                </div>
                <section id="chessboard">
                    <img
                        src="assets/pieces/white-rook.svg" alt="white-rook" draggable="false"
                        data-row="0" data-column="0" data-color="white" data-type="rook"
                        style="bottom: calc(0 * 64px); left: calc(0 * 64px);"
                    >
                    <img
                        src="assets/pieces/white-knight.svg" alt="white-knight" draggable="false"
                        data-row="0" data-column="1" data-color="white" data-type="knight"
                        style="bottom: calc(0 * 64px); left: calc(1 * 64px);"
                    >
                    <img
                        src="assets/pieces/white-bishop.svg" alt="white-bishop" draggable="false"
                        data-row="0" data-column="2" data-color="white" data-type="bishop"
                        style="bottom: calc(0 * 64px); left: calc(2 * 64px);"
                    >
                    <img
                        src="assets/pieces/white-queen.svg" alt="white-queen" draggable="false"

                    >
                    <img
                        src="assets/pieces/white-king.svg" alt="white-king" draggable="false"

                    <img

                    <img

                        data-row="0" data-column="6" data-color="white" data-type="knight"
                        style="bottom: calc(0 * 64px); left: calc(6 * 64px);"
                    >
                    <img
                        src="assets/pieces/white-rook.svg" alt="white-rook" draggable="false"
                        data-row="0" data-column="7" data-color="white" data-type="rook"
                        style="bottom: calc(0 * 64px); left: calc(7 * 64px);"
                    >
                    <img
                        src="assets/pieces/black-rook.svg" alt="black-rook" draggable="false"
                        data-row="7" data-column="0" data-color="black" data-type="rook"
                        style="bottom: calc(7 * 64px); left: calc(0 * 64px);"
                    >
                    <img
                        src="assets/pieces/black-knight.svg" alt="black-knight" draggable="false"

                    <img
                        src="assets/pieces/white-pawn.svg" alt="white-pawn" draggable="false"

                        style="bottom: calc(1 * 64px); left: calc(0 * 64px);"

                        data-row="6" data-column="6" data-color="black" data-type="pawn"
                        style="bottom: calc(6 * 64px); left: calc(6 * 64px);"
                    >
                    <img
                        src="assets/pieces/black-pawn.svg" alt="black-pawn" draggable="false"
                        data-row="6" data-column="7" data-color="black" data-type="pawn"
                        style="bottom: calc(6 * 64px); left: calc(7 * 64px);"
                    >
                    <div class="row">
                        <div class="square" data-row="7" data-column="0"></div>
                        <div class="square" data-row="7" data-column="1"></div>
                        <div class="square" data-row="7" data-column="2"></div>
                        <div class="square" data-row="7" data-column="3"></div>
                        <div class="square" data-row="7" data-column="4"></div>
                        <div class="square" data-row="7" data-column="5"></div>
                        <div class="square" data-row="7" data-column="6"></div>
                        <div class="square" data-row="7" data-column="7"></div>
                    </div>
                    <div class="row">
                        <div class="square" data-row="6" data-column="0"></div>
                        <div class="square" data-row="6" data-column="1"></div>
                        <div class="square" data-row="6" data-column="2"></div>

                        <div class="square" data-row="0" data-column="0"></div>
                        <div class="square" data-row="0" data-column="1"></div>

</body>
</html>
